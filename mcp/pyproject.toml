[project]
name = "tempmail-mcp"
version = "0.1.0"
description = "TempMail MCP Server - Fast Model Context Protocol server"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.31.0",
    "groq>=0.9.0",
    "langchain-groq>=0.2.0",
    "langchain-mcp-adapters>=0.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
