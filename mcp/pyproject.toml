[project]
name = "tempmail-mcp"
version = "0.1.0"
description = "TempMail MCP Server - Fast Model Context Protocol server"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
